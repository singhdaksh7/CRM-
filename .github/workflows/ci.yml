name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, validate, typecheck, lint, test, build
    runs-on: ubuntu-latest

    # A real Postgres service so prisma validate/generate/migrate run against
    # the actual target database, not just parse the schema file offline.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: delhi_broker_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d delhi_broker_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://crm:crm_ci_password@localhost:5432/delhi_broker_crm_ci?schema=public"
      DIRECT_URL: "postgresql://crm:crm_ci_password@localhost:5432/delhi_broker_crm_ci?schema=public"
      AUTH_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      WHATSAPP_PROVIDER: "MOCK"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      # Historical schema prerequisite: SavedViewEntityType/saved_views/
      # properties.tags were shipped to production via a manual SQL file
      # (prisma/manual-migrations/2026-08-05-phase2-saved-views-and-tags.sql)
      # and were never captured as a tracked Prisma migration. Production
      # already has this type from that manual run; a fresh CI database
      # does not. The Demand Pool migration (20260819120000_demand_pool_
      # matching) is the first tracked migration to depend on part of that
      # drift (`ALTER TYPE "SavedViewEntityType" ADD VALUE ...`), so we
      # create just that one prerequisite type here before replaying the
      # tracked chain - see prisma/ci/legacy-schema-bootstrap.sql for the
      # full rationale and why the rest of that historical file (the
      # saved_views table itself) is deliberately NOT included. This never
      # writes to _prisma_migrations and only ever targets this job's own
      # ephemeral postgres service (DATABASE_URL above is hardcoded to
      # localhost) - it can never reach production.
      - name: Bootstrap legacy manually-shipped schema (CI database only)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/ci/legacy-schema-bootstrap.sql

      - name: Apply migrations to CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      - name: Production build (Webpack)
        run: npm run build -- --webpack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

name: CI

# Runs on every feature-branch push and on every PR into main (and on main itself,
# which is what the production deploy workflow waits for).
on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

# Cancel superseded runs on feature branches/PRs; never cancel a run on main
# (a cancelled main run would silently skip that commit's deployment).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Fast static checks: secrets, dumps, committed env, dangerous deploy config,
  # commands that must never run against production.
  # ---------------------------------------------------------------------------
  repo-safety:
    name: repo-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Security / config scan
        run: bash .github/scripts/repo-safety.sh

  # ---------------------------------------------------------------------------
  # Prisma schema / migration change detection + destructive-SQL gate.
  # Never connects to any database.
  # ---------------------------------------------------------------------------
  db-migration-safety:
    name: db-migration-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine comparison base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              base="$before"
            else
              git fetch --no-tags origin main
              base=$(git merge-base origin/main HEAD)
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing $base..HEAD"
      - name: Migration safety review
        id: mig
        run: python3 deploy/scripts/migration-safety.py --base "${{ steps.base.outputs.base }}" --head HEAD | tee migration-report.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Database change review'; echo '```'; cat migration-report.txt 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Install, typecheck, lint, tests, build.
  # ---------------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real Postgres service so prisma migrate deploy replays the tracked chain.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: delhi_broker_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d delhi_broker_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://crm:crm_ci_password@localhost:5432/delhi_broker_crm_ci?schema=public"
      DIRECT_URL: "postgresql://crm:crm_ci_password@localhost:5432/delhi_broker_crm_ci?schema=public"
      AUTH_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      WHATSAPP_PROVIDER: "MOCK"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # matches the production Dockerfile (node:22-slim)
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Diff integrity (whitespace errors / conflict markers)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags origin main
            git diff --check "$(git merge-base origin/main HEAD)...HEAD" || true
            git diff --check
          fi

      # Historical schema prerequisite: SavedViewEntityType was shipped to
      # production via a manual SQL file and never captured as a tracked
      # migration. A fresh CI database needs just that type before replaying
      # the tracked chain (see prisma/ci/legacy-schema-bootstrap.sql). This only
      # ever targets this job's own ephemeral service on localhost.
      - name: Bootstrap legacy manually-shipped schema (CI database only)
        run: psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f prisma/ci/legacy-schema-bootstrap.sql

      - name: Apply migrations to CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  # Single aggregate result - handy as the one required check if preferred.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [repo-safety, db-migration-safety, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs green
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\|skipped\)"' && { echo "a required job did not succeed"; exit 1; }
          echo "all CI jobs succeeded"

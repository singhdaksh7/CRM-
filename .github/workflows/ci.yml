name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, validate, typecheck, lint, test, build
    runs-on: ubuntu-latest

    # A real Postgres service so prisma validate/generate/migrate run against
    # the actual target database, not just parse the schema file offline.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: delhi_broker_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d delhi_broker_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://crm:crm_ci_password@localhost:5432/delhi_broker_crm_ci?schema=public"
      DIRECT_URL: "postgresql://crm:crm_ci_password@localhost:5432/delhi_broker_crm_ci?schema=public"
      AUTH_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      WHATSAPP_PROVIDER: "MOCK"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations to CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      - name: Production build (Webpack)
        run: npm run build -- --webpack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

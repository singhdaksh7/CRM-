name: kp-properties-crm

# Production Docker Compose for KP Properties CRM on Hostinger VPS.
# Traefik already owns host ports 80/443. This stack is only the CRM container.
# PostgreSQL and Redis stay on the VPS and are reached through environment
# variables. Cloudflare R2 stays external. No database or Redis is started here,
# and the container does not run Prisma migrations on startup.
# The CRM joins the existing external Docker network Traefik already uses.

services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://crm.kpproperties.co.in}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://crm.kpproperties.co.in}
    container_name: kp-crm
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    ports:
      # Bound strictly to host loopback (127.0.0.1) - never exposed on 0.0.0.0
      - "127.0.0.1:${CRM_HOST_PORT:-3000}:3000"
    labels:
      - "traefik.enable=true"
      # HTTPS Router
      - "traefik.http.routers.kpcrm.rule=Host(`${CRM_DOMAIN:-crm.kpproperties.co.in}`)"
      - "traefik.http.routers.kpcrm.entrypoints=websecure"
      - "traefik.http.routers.kpcrm.tls=true"
      - "traefik.http.routers.kpcrm.tls.certresolver=letsencrypt"
      # Load Balancer pointing to container internal port
      - "traefik.http.services.kpcrm.loadbalancer.server.port=3000"
      - "traefik.http.services.kpcrm.loadbalancer.passhostheader=true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kp-backend

networks:
  kp-backend:
    external: true

name: kp-properties-crm

# Production Docker Compose for KP Properties CRM on Hostinger VPS
# Traefik runs in host network mode (network_mode: host) on ports 80/443.
# This stack contains ONLY the CRM container.
# External dependencies: Supabase PostgreSQL, Cloudflare R2, Upstash/External Redis.

services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kp-crm
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Bound strictly to host loopback (127.0.0.1) - never exposed on 0.0.0.0
      - "127.0.0.1:${CRM_HOST_PORT:-3000}:3000"
    labels:
      - "traefik.enable=true"
      # HTTPS Router
      - "traefik.http.routers.kpcrm.rule=Host(`${CRM_DOMAIN:-crm.kpproperties.co.in}`)"
      - "traefik.http.routers.kpcrm.entrypoints=websecure"
      - "traefik.http.routers.kpcrm.tls=true"
      - "traefik.http.routers.kpcrm.tls.certresolver=letsencrypt"
      # Load Balancer pointing to container internal port
      - "traefik.http.services.kpcrm.loadbalancer.server.port=3000"
      - "traefik.http.services.kpcrm.loadbalancer.passhostheader=true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

name: delhi-broker-crm-prod

# Production-shaped example (Option B in DEPLOYMENT.md - Docker/AWS). Uses
# real Postgres + Redis + the containerized app image (Dockerfile). Copy
# this file, fill in real secrets via a .env.production (never commit real
# values), and adjust image/registry names for your deployment target.
#
# Object storage (S3) is NOT included here as a container - production file
# storage should be a real managed bucket (AWS S3), not a self-hosted MinIO
# container, so it isn't part of this compose file. Use docker-compose.yml's
# MinIO service for local/dev testing only.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # Required when a reverse proxy/load balancer terminates TLS in front of
      # this container (standard for ECS/Docker deployments) - see
      # DEPLOYMENT.md "Environment variables".
      AUTH_TRUST_HOST: "true"
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-MOCK}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      ACRES_99_API_KEY: ${ACRES_99_API_KEY:-}
      MAGICBRICKS_API_KEY: ${MAGICBRICKS_API_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-delhi_broker_crm}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published by default - only the app container talks to
    # it over the compose network. Publish 5432 explicitly if you need an
    # external admin connection, and firewall it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_prod_data:
  redis_prod_data:

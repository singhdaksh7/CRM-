<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - KP Properties</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafbfc;
        color: #1b2430;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #3366ff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 20px;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #596579;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">KP</div>
      <h1>You're offline</h1>
      <p>This page needs a network connection to load fresh data. Reconnect and try again.</p>
    </div>
  </body>
</html>
